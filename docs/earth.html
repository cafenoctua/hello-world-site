<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth | Hello World</title>
  <style>
:root { --bg: #f7f7f5; --fg: #222; --muted: #777; --line: #ddd; --accent: #2563eb;
        --land: #16a34a; --sea: #1d4ed8; --night: #9ca3af; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111318; --fg: #eee; --muted: #999; --line: #333; --accent: #60a5fa;
          --land: #4ade80; --sea: #60a5fa; --night: #4b5563; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
       font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
nav { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); }
nav a { padding: 12px 16px; color: var(--muted); text-decoration: none;
        border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
main { flex: 1; display: grid; place-items: center; padding: 16px; }
h1 { font-size: 3rem; margin: 0; }
pre.globe { margin: 0; font: 12px/12px ui-monospace, Menlo, Consolas, monospace;
            letter-spacing: 0; user-select: none; }
pre.globe .l { color: var(--land); } pre.globe .s { color: var(--sea); }
pre.globe .n { color: var(--night); }
@media (max-width: 600px) { pre.globe { font-size: 7px; line-height: 7px; } }
.game { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
canvas.run { display: block; width: min(100%, 460px, calc((100vh - 120px) * 0.75));
             aspect-ratio: 3 / 4; border-radius: 12px; touch-action: none;
             box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.game p { margin: 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <nav><a href="index.html">Hello</a><a href="earth.html" aria-current="page">Earth</a><a href="run.html">Run</a></nav>
  <main><pre class="globe" id="globe" aria-label="回転するアスキーアートの地球"></pre>
<script>
const MAP = ["................................................................................................", "................................................................................................", ".......................#.#.################.................##..#........#......................", "................#.....#.###..#############..........#......................##...................", "...............###.#.#######.....#########....................#......#######.###.#..............", ".....######.##.#.####.##.#.###....#######...........#####.......#.#.#########################.##", "#########################...##....####.....#.......###.##..#####################################", "....###################....##......##............####.####################################..###.", "......#.....###########....####....................#...###############################....#.....", ".............#############.######.............##..#.################################......#.....", "..............##################................#####################################...........", "...............################................######################################...........", "...............##############.................###..####....#########################.##.........", "...............#############..................##..#.##.#########################.#...#..........", "................############..................#.###.......######################..#.#...........", ".................#########...................#######.##..#######################................", "..................####....#..................################.##################................", "...................###......................#############.####....#############.................", "....................##..#..#................##############.#####...####..###....................", ".....................####...................##############.###......##...####...#...............", ".........................#..................###############.........#.....###...................", "............................####............##################......##.........#.#..............", "...........................#######...........###.############..................#................", "...........................########................#########..............##..#.................", "..........................##########..............#########................#.##..#.#............", "..........................#############............#######...........................##.........", "...........................############.............#######............................#........", "............................##########.............########........................#............", ".............................#########.............#######..#....................####.#.........", ".............................########...............#####...#..................#########........", ".............................######.................#####...#.................###########.......", ".............................######.................#####.....................###########.......", ".............................#####...................###.......................###.######.......", ".............................####....................................................###......#.", "............................###...............................................................#.", ".............................##..............................................................#..", "............................##..................................................................", "............................##..................................................................", "................................................................................................", "................................................................................................", "................................................................................................", "................................................................................................", "..............................##...........................#######..######################......", "....................##........##............################################################....", ".........##################.............###################################################.....", "........####################......#....####################################################.....", "#....###########################################################################################", "################################################################################################"];
const MW = MAP[0].length, MH = MAP.length;
const ROWS = 36, TILT = 23.4 * Math.PI / 180;
const SHADE = " .:-=+*#%@";
const el = document.getElementById("globe");
// 等幅フォントの文字の縦横比を実測し、球が真円に見える列数にする
let COLS = 64;
function measure() {
  el.textContent = "M".repeat(100);
  const w = el.getBoundingClientRect().width / 100;
  const h = parseFloat(getComputedStyle(el).lineHeight) || parseFloat(getComputedStyle(el).fontSize);
  COLS = Math.round(ROWS * h / w);
}
measure();
addEventListener("resize", () => { measure(); frame(rot); });
const isLand = (lat, lon) => {
  const i = Math.floor(((lon + Math.PI) / (2 * Math.PI)) * MW) % MW;
  const j = Math.min(MH - 1, Math.floor(((Math.PI / 2 - lat) / Math.PI) * MH));
  return MAP[j][(i + MW) % MW] === "#";
};
function frame(rot) {
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  let out = "";
  for (let r = 0; r < ROWS; r++) {
    let cls = "", run = "";
    const flush = () => { if (run) out += cls ? `<span class="${cls}">${run}</span>` : run; run = ""; };
    for (let c = 0; c < COLS; c++) {
      const x = ((c + 0.5) / COLS) * 2 - 1, y = 1 - ((r + 0.5) / ROWS) * 2;
      const d = x * x + y * y;
      let ch = " ", k = "";
      if (d <= 1) {
        const z = Math.sqrt(1 - d);
        // 地軸の傾きを戻して緯度経度を求める
        const y2 = y * ct + z * st, z2 = -y * st + z * ct;
        const lat = Math.asin(y2);
        let lon = Math.atan2(x, z2) + rot;
        lon = ((lon + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
        const light = Math.max(0, x * -0.5 + y * 0.4 + z * 0.77);  // 左上からの光
        if (isLand(lat, lon)) {
          ch = SHADE[Math.min(SHADE.length - 1, 3 + Math.round(light * 6))];
          k = light < 0.12 ? "n" : "l";
        } else {
          ch = light < 0.12 ? "." : "~";
          k = light < 0.12 ? "n" : "s";
        }
      }
      if (k !== cls) { flush(); cls = k; }
      run += ch;
    }
    flush();
    out += "\n";
  }
  el.innerHTML = out;
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let rot = 0, last = 0;
function tick(t) {
  if (t - last > 50) { rot -= 0.03; frame(rot); last = t; }
  if (!reduce) requestAnimationFrame(tick);
}
frame(rot);
if (!reduce) requestAnimationFrame(tick);
</script></main>
</body>
</html>
